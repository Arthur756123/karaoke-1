<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaoke Party Pro</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0914;
      --card-bg: #161224;
      --card-bg-hover: #211b36;
      --primary: #ff007f;
      --primary-hover: #e00070;
      --secondary: #00f0ff;
      --accent: #9d00ff;
      --text: #ffffff;
      --text-dim: #a09cb0;
      --border: #2e2848;
      --success: #00ff88;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #1f1235 0%, #0b0914 100%);
      padding: 15px 20px;
      border-bottom: 2px solid var(--primary);
      box-shadow: 0 4px 25px rgba(255, 0, 127, 0.25);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    header h1 {
      font-size: 1.8rem;
      color: #fff;
      text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mode-switch {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--border);
    }

    .mode-btn {
      padding: 8px 18px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
      flex: 1;
      transition: all 0.3s ease;
    }

    /* Speelmodus CSS Aanpassing */
    body.play-mode .container {
      grid-template-columns: 1fr;
    }

    body.play-mode .manage-only {
      display: none !important;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: var(--secondary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Player Area */
    .player-wrapper {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .player-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
    }

    .player-container iframe,
    .player-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      background: radial-gradient(circle, #1a1530 0%, #080610 100%);
      text-align: center;
      padding: 20px;
    }

    .player-placeholder i {
      font-size: 4.5rem;
      margin-bottom: 15px;
      color: var(--primary);
    }

    .player-controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 18px;
      border-radius: 8px;
      border-left: 4px solid var(--secondary);
      flex-wrap: wrap;
      gap: 10px;
    }

    .song-info-active {
      flex: 1;
      min-width: 200px;
    }

    .song-info-active .title {
      font-weight: bold;
      font-size: 1.1rem;
    }

    .song-info-active .artist {
      color: var(--text-dim);
      font-size: 0.88rem;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0d0a17;
      color: #fff;
      font-size: 0.95rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--secondary);
    }

    /* Buttons */
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.9rem;
      transition: all 0.2s;
      color: white;
    }

    .btn-primary { background: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary { background: #282142; border: 1px solid var(--border); }
    .btn-secondary:hover { background: #382f5c; color: var(--secondary); }

    .btn-accent { background: linear-gradient(45deg, var(--primary), var(--accent)); }
    .btn-accent:hover { opacity: 0.9; }

    .btn-block { width: 100%; }
    .btn-icon { padding: 6px 10px; font-size: 0.85rem; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #bd2130; }

    /* Songs List */
    .song-list {
      list-style: none;
      max-height: 420px;
      overflow-y: auto;
    }

    .song-item {
      background: #110d1f;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .song-item.played {
      opacity: 0.5;
    }

    .song-item.active {
      border-color: var(--primary);
      background: rgba(255, 0, 127, 0.15);
    }

    .song-item .details {
      flex: 1;
      min-width: 0;
    }

    .song-item .title-text {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.95rem;
    }

    .song-item .artist-text {
      font-size: 0.8rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modal / Wheel Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .wheel-modal {
      background: var(--card-bg);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 0 30px rgba(157, 0, 255, 0.4);
      position: relative;
    }

    .wheel-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 20px auto;
    }

    canvas#wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid var(--secondary);
    }

    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid var(--primary);
      z-index: 10;
    }

    /* Edit Form Modal */
    .edit-modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 400px;
      width: 90%;
    }
  </style>
</head>
<body class="manage-mode">

  <header>
    <h1><i class="fa-solid fa-microphone-lines"></i> Karaoke Party Pro</h1>
    <div class="mode-switch">
      <button class="mode-btn active" id="btn-mode-manage" onclick="setMode('manage')">
        <i class="fa-solid fa-sliders"></i> Beheermodus
      </button>
      <button class="mode-btn" id="btn-mode-play" onclick="setMode('play')">
        <i class="fa-solid fa-play"></i> Speelmodus
      </button>
    </div>
  </header>

  <div class="container">
    
    <!-- Linker Kolom: Videospeler -->
    <div class="left-column">
      <div class="card player-wrapper">
        <h2><i class="fa-solid fa-tv"></i> Karaoke Scherm</h2>
        
        <div class="player-container" id="player-container">
          <div id="player-placeholder" class="player-placeholder">
            <i class="fa-solid fa-compact-disc fa-spin-slow"></i>
            <p>Kies een liedje uit de lijst of draai aan het rad om te starten!</p>
          </div>
          <div id="player"></div>
        </div>

        <div class="player-controls-bar">
          <div class="song-info-active">
            <div class="title" id="current-title">Geen nummer actief</div>
            <div class="artist" id="current-artist">Selecteer een nummer</div>
          </div>
          <div class="action-buttons">
            <button class="btn btn-accent" onclick="openWheel()">
              <i class="fa-solid fa-dharmachakra"></i> Rad van Fortuin
            </button>
            <button class="btn btn-secondary" onclick="playNext()">
              <i class="fa-solid fa-forward"></i> Volgende
            </button>
            <button class="btn btn-secondary btn-icon" onclick="toggleFullscreen()" title="Volledig Scherm">
              <i class="fa-solid fa-expand"></i>
            </button>
            <a id="youtube-fallback-btn" class="btn btn-secondary btn-icon" href="#" target="_blank" title="Open direct op YouTube" style="display:none;">
              <i class="fa-brands fa-youtube"></i>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Rechter Kolom: Beheer (Formulier & Lijst) -->
    <div class="right-column manage-only" style="display: flex; flex-direction: column; gap: 20px;">
      
      <!-- Nummer Toevoegen -->
      <div class="card">
        <h2><i class="fa-solid fa-plus"></i> Nummer Toevoegen</h2>
        <form onsubmit="handleAddSong(event)">
          <div class="form-group">
            <label>Titel / Liedje</label>
            <input type="text" id="add-title" placeholder="bv. Angles (Karaoke)" required>
          </div>
          <div class="form-group">
            <label>Artiest (Optioneel)</label>
            <input type="text" id="add-artist" placeholder="bv. Tourist LeMC">
          </div>
          <div class="form-group">
            <label>YouTube Link / URL</label>
            <input type="text" id="add-url" placeholder="https://www.youtube.com/watch?v=..." required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">
            <i class="fa-solid fa-plus"></i> Toevoegen
          </button>
        </form>
      </div>

      <!-- Afspeellijst -->
      <div class="card" style="flex:1;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h2><i class="fa-solid fa-list"></i> Afspeellijst</h2>
          <button class="btn btn-secondary btn-icon" onclick="resetPlayedStatus()" title="Reset gespeelde status">
            <i class="fa-solid fa-rotate-right"></i> Reset Status
          </button>
        </div>
        <ul class="song-list" id="song-list"></ul>
      </div>

    </div>

  </div>

  <!-- Spinwiel Modal -->
  <div class="modal-overlay" id="wheel-modal">
    <div class="wheel-modal">
      <h2 style="color:var(--secondary);"><i class="fa-solid fa-dharmachakra"></i> Willekeurig Nummer</h2>
      <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <canvas id="wheel" width="280" height="280"></canvas>
      </div>
      <button class="btn btn-accent btn-block" id="spin-btn" onclick="spinWheel()">
        <i class="fa-solid fa-play"></i> Draai het Rad!
      </button>
      <button class="btn btn-secondary btn-block" style="margin-top: 10px;" onclick="closeWheel()">Sluiten</button>
    </div>
  </div>

  <!-- Bewerken Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="edit-modal">
      <h2><i class="fa-solid fa-pen"></i> Nummer Bewerken</h2>
      <form onsubmit="handleSaveEdit(event)" style="margin-top: 15px;">
        <input type="hidden" id="edit-id">
        <div class="form-group">
          <label>Titel</label>
          <input type="text" id="edit-title" required>
        </div>
        <div class="form-group">
          <label>Artiest</label>
          <input type="text" id="edit-artist">
        </div>
        <div class="form-group">
          <label>YouTube Link</label>
          <input type="text" id="edit-url" required>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
          <button type="submit" class="btn btn-primary btn-block">Opslaan</button>
          <button type="button" class="btn btn-secondary btn-block" onclick="closeEditModal()">Annuleren</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Standaard afspeellijst
    const defaultSongs = [
      { id: "1", title: "Leef (Karaoke)", artist: "André Hazes Jr.", youtubeId: "3x9eS3uI0I4", played: false },
      { id: "2", title: "I Want It That Way", artist: "Backstreet Boys", youtubeId: "L_LUpnjgPso", played: false }
    ];

    let songs = [];
    let currentSongId = null;
    let isSpinning = false;

    // App Initialiseren
    function init() {
      const saved = localStorage.getItem('karaoke_pro_songs');
      if (saved) {
        try { songs = JSON.parse(saved); } catch(e) { songs = [...defaultSongs]; }
      } else {
        songs = [...defaultSongs];
        saveSongs();
      }
      renderSongList();
    }

    function saveSongs() {
      localStorage.setItem('karaoke_pro_songs', JSON.stringify(songs));
      renderSongList();
    }

    // Modus wisselen (Beheer vs Speel)
    function setMode(mode) {
      document.body.classList.remove('manage-mode', 'play-mode');
      document.body.classList.add(mode + '-mode');

      document.getElementById('btn-mode-manage').classList.toggle('active', mode === 'manage');
      document.getElementById('btn-mode-play').classList.toggle('active', mode === 'play');
    }

    // YouTube ID Extractie
    function extractYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // Nummer Toevoegen
    function handleAddSong(e) {
      e.preventDefault();
      const title = document.getElementById('add-title').value.trim();
      const artist = document.getElementById('add-artist').value.trim() || "Onbekend";
      const url = document.getElementById('add-url').value.trim();

      const youtubeId = extractYouTubeId(url);
      if (!youtubeId) {
        alert("Voer een geldige YouTube link in.");
        return;
      }

      songs.push({ id: Date.now().toString(), title, artist, youtubeId, played: false });
      saveSongs();

      document.getElementById('add-title').value = '';
      document.getElementById('add-artist').value = '';
      document.getElementById('add-url').value = '';
    }

    // Nummer Afspelen
    function playSong(id) {
      const song = songs.find(s => s.id === id);
      if (!song) return;

      currentSongId = id;
      song.played = true; // Markeren als gespeeld
      saveSongs();

      document.getElementById('player-placeholder').style.display = 'none';
      const playerDiv = document.getElementById('player');
      
      // Gebruik youtube-nocookie om Embed Fout 153 en CORS te vermijden
      playerDiv.innerHTML = `
        <iframe 
          src="https://www.youtube-nocookie.com/embed/${song.youtubeId}?autoplay=1&rel=0" 
          title="${escapeHtml(song.title)}" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      `;

      document.getElementById('current-title').textContent = song.title;
      document.getElementById('current-artist').textContent = song.artist;

      // Fallback knop direct naar YouTube
      const ytBtn = document.getElementById('youtube-fallback-btn');
      ytBtn.href = `https://www.youtube.com/watch?v=${song.youtubeId}`;
      ytBtn.style.display = 'inline-flex';
    }

    function playNext() {
      const unplayed = songs.filter(s => !s.played);
      if (unplayed.length > 0) {
        playSong(unplayed[0].id);
      } else if (songs.length > 0) {
        playSong(songs[0].id);
      }
    }

    function resetPlayedStatus() {
      songs.forEach(s => s.played = false);
      saveSongs();
    }

    function deleteSong(id, event) {
      event.stopPropagation();
      if (confirm("Nummer verwijderen?")) {
        songs = songs.filter(s => s.id !== id);
        saveSongs();
      }
    }

    // Bewerken Modal
    function openEditModal(id, event) {
      event.stopPropagation();
      const song = songs.find(s => s.id === id);
      if (!song) return;

      document.getElementById('edit-id').value = song.id;
      document.getElementById('edit-title').value = song.title;
      document.getElementById('edit-artist').value = song.artist;
      document.getElementById('edit-url').value = `https://www.youtube.com/watch?v=${song.youtubeId}`;

      document.getElementById('edit-modal').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.remove('active');
    }

    function handleSaveEdit(e) {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      const song = songs.find(s => s.id === id);

      if (song) {
        const url = document.getElementById('edit-url').value;
        const youtubeId = extractYouTubeId(url);
        if (!youtubeId) {
          alert("Ongeldige YouTube URL");
          return;
        }

        song.title = document.getElementById('edit-title').value.trim();
        song.artist = document.getElementById('edit-artist').value.trim() || "Onbekend";
        song.youtubeId = youtubeId;
        saveSongs();
        closeEditModal();
      }
    }

    // Spinwiel / Rad van Fortuin
    let currentAngle = 0;

    function openWheel() {
      const unplayed = songs.filter(s => !s.played);
      if (unplayed.length === 0) {
        if (songs.length === 0) {
          alert("Geen nummers beschikbaar. Voeg eerst nummers toe!");
          return;
        }
        if (confirm("Alle nummers zijn al een keer gespeeld! Wil je de status resetten en opnieuw draaien?")) {
          resetPlayedStatus();
        } else {
          return;
        }
      }

      document.getElementById('wheel-modal').classList.add('active');
      drawWheel();
    }

    function closeWheel() {
      if (isSpinning) return;
      document.getElementById('wheel-modal').classList.remove('active');
    }

    function drawWheel() {
      const canvas = document.getElementById('wheel');
      const ctx = canvas.getContext('2d');
      const unplayed = songs.filter(s => !s.played);
      const numSegments = unplayed.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (numSegments === 0) return;

      const arc = (2 * Math.PI) / numSegments;
      const colors = ['#ff007f', '#00f0ff', '#9d00ff', '#ffbe0b', '#00ff88', '#ff0055'];

      for (let i = 0; i < numSegments; i++) {
        const angle = currentAngle + i * arc;
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(140, 140);
        ctx.arc(140, 140, 140, angle, angle + arc);
        ctx.lineTo(140, 140);
        ctx.fill();

        // Tekst
        ctx.save();
        ctx.translate(140, 140);
        ctx.rotate(angle + arc / 2);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 12px Segoe UI";
        ctx.fillText(unplayed[i].title.substring(0, 14), 45, 4);
        ctx.restore();
      }
    }

    function spinWheel() {
      if (isSpinning) return;
      const unplayed = songs.filter(s => !s.played);
      if (unplayed.length === 0) return;

      isSpinning = true;
      document.getElementById('spin-btn').disabled = true;

      const spinAngle = Math.floor(Math.random() * 360) + 1440; // Ten minste 4 rondjes
      const duration = 4000;
      const start = performance.now();

      function animate(time) {
        const elapsed = time - start;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);

        currentAngle = (easeOut * (spinAngle * Math.PI / 180));
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          document.getElementById('spin-btn').disabled = false;

          // Bepaal geselecteerd nummer
          const numSegments = unplayed.length;
          const arc = (2 * Math.PI) / numSegments;
          const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
          // Correctie voor de pijl die bovenaan staat (3*PI/2)
          const index = Math.floor(((normalizedAngle + Math.PI / 2) % (2 * Math.PI)) / arc);
          const selectedSong = unplayed[index % numSegments];

          setTimeout(() => {
            closeWheel();
            playSong(selectedSong.id);
          }, 500);
        }
      }

      requestAnimationFrame(animate);
    }

    // Fullscreen Toggle
    function toggleFullscreen() {
      const container = document.getElementById('player-container');
      if (!document.fullscreenElement) {
        if (container.requestFullscreen) container.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // Render Song List UI
    function renderSongList() {
      const listEl = document.getElementById('song-list');
      if (songs.length === 0) {
        listEl.innerHTML = `<li style="text-align:center; color:var(--text-dim); padding:20px;">Geen nummers aanwezig</li>`;
        return;
      }

      listEl.innerHTML = songs.map(song => {
        const isActive = song.id === currentSongId;
        return `
          <li class="song-item ${isActive ? 'active' : ''} ${song.played ? 'played' : ''}" onclick="playSong('${song.id}')">
            <div class="details">
              <div class="title-text">${escapeHtml(song.title)} ${song.played ? '<i class="fa-solid fa-check" style="color:var(--success); font-size:0.8rem;"></i>' : ''}</div>
              <div class="artist-text">${escapeHtml(song.artist)}</div>
            </div>
            <div style="display:flex; gap:4px;">
              <button class="btn btn-secondary btn-icon" onclick="openEditModal('${song.id}', event)" title="Bewerken">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button class="btn btn-danger btn-icon" onclick="deleteSong('${song.id}', event)" title="Verwijderen">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </li>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.onload = init;
  </script>
</body>
</html>
