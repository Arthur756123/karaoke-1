<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaoke Avond Playlists</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f0c1b;
      --card-bg: #1a162b;
      --card-bg-hover: #25203b;
      --primary: #ff007f;
      --primary-hover: #e00070;
      --secondary: #00f0ff;
      --text: #ffffff;
      --text-dim: #a09cb0;
      --border: #2e2848;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #1f1235 0%, #0f0c1b 100%);
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid var(--primary);
      box-shadow: 0 4px 20px rgba(255, 0, 127, 0.2);
    }

    header h1 {
      font-size: 2.2rem;
      color: #fff;
      text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 25px;
      flex: 1;
    }

    @media (min-width: 900px) {
      .container {
        grid-template-columns: 1.2fr 0.8fr;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
    }

    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 15px;
      color: var(--secondary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Player Section */
    .player-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      margin-bottom: 15px;
    }

    .player-container iframe,
    .player-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      background: #080610;
      text-align: center;
      padding: 20px;
    }

    .player-placeholder i {
      font-size: 4rem;
      margin-bottom: 15px;
      color: var(--primary);
      opacity: 0.8;
    }

    .current-song-info {
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      border-left: 4px solid var(--secondary);
    }

    .current-song-title {
      font-weight: bold;
      font-size: 1.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .current-song-artist {
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #100d1d;
      color: #fff;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--secondary);
    }

    /* Buttons */
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.95rem;
      transition: all 0.2s;
      color: white;
    }

    .btn-primary {
      background: var(--primary);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
    }

    .btn-secondary {
      background: #2a2444;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: #373059;
      color: var(--secondary);
    }

    .btn-accent {
      background: linear-gradient(45deg, var(--primary), #9d00ff);
    }
    .btn-accent:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px rgba(157, 0, 255, 0.4);
    }

    .btn-block {
      width: 100%;
    }

    .btn-icon {
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .btn-danger {
      background: #dc3545;
    }
    .btn-danger:hover {
      background: #bd2130;
    }

    /* Song List */
    .song-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .song-count {
      font-size: 0.85rem;
      background: var(--border);
      padding: 3px 8px;
      border-radius: 12px;
    }

    .song-list {
      list-style: none;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .song-list::-webkit-scrollbar {
      width: 6px;
    }
    .song-list::-webkit-scrollbar-track {
      background: var(--bg-color);
      border-radius: 3px;
    }
    .song-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .song-item {
      background: #120e22;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: all 0.2s;
    }

    .song-item:hover {
      border-color: var(--secondary);
      background: var(--card-bg-hover);
    }

    .song-item.active {
      border-color: var(--primary);
      background: rgba(255, 0, 127, 0.1);
    }

    .song-details {
      flex: 1;
      min-width: 0;
    }

    .song-title-text {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist-text {
      font-size: 0.85rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-actions {
      display: flex;
      gap: 6px;
    }

    .empty-state {
      text-align: center;
      padding: 30px 10px;
      color: var(--text-dim);
    }

    .empty-state i {
      font-size: 2.5rem;
      margin-bottom: 10px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-microphone-lines"></i> Karaoke Avond Playlists</h1>
  </header>

  <div class="container">
    
    <!-- Linker Kolom: Speler -->
    <div class="left-column">
      <div class="card">
        <h2><i class="fa-solid fa-tv"></i> Karaoke Scherm</h2>
        
        <div class="player-container">
          <div id="player-placeholder" class="player-placeholder">
            <i class="fa-solid fa-music"></i>
            <p>Kies een liedje uit de lijst of druk op "Willekeurig Liedje" om te starten!</p>
          </div>
          <div id="player"></div>
        </div>

        <div class="current-song-info">
          <div class="current-song-title" id="current-title">Geen nummer geselecteerd</div>
          <div class="current-song-artist" id="current-artist">Selecteer een nummer om te beginnen</div>
        </div>

        <div class="controls">
          <button class="btn btn-accent" onclick="playRandomSong()">
            <i class="fa-solid fa-shuffle"></i> Willekeurig Liedje
          </button>
          <button class="btn btn-secondary" onclick="playNextSong()">
            <i class="fa-solid fa-forward"></i> Volgende
          </button>
        </div>
      </div>
    </div>

    <!-- Rechter Kolom: Toevoegen & Lijst -->
    <div class="right-column" style="display: flex; flex-direction: column; gap: 25px;">
      
      <!-- Liedje Toevoegen -->
      <div class="card">
        <h2><i class="fa-solid fa-plus"></i> Liedje Toevoegen</h2>
        <form id="add-song-form" onsubmit="handleAddSong(event)">
          <div class="form-group">
            <label for="song-title">Titel / Liedje</label>
            <input type="text" id="song-title" placeholder="bv. Bohemian Rhapsody (Karaoke)" required>
          </div>
          <div class="form-group">
            <label for="song-artist">Artiest (Optioneel)</label>
            <input type="text" id="song-artist" placeholder="bv. Queen">
          </div>
          <div class="form-group">
            <label for="youtube-url">YouTube Link / URL</label>
            <input type="text" id="youtube-url" placeholder="https://www.youtube.com/watch?v=..." required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">
            <i class="fa-solid fa-floppy-disk"></i> Toevoegen aan Lijst
          </button>
        </form>
      </div>

      <!-- Afspeellijst -->
      <div class="card">
        <div class="song-list-header">
          <h2><i class="fa-solid fa-list"></i> Karaoke Lijst</h2>
          <span class="song-count" id="song-count">0 nummers</span>
        </div>
        
        <ul class="song-list" id="song-list">
          <!-- Dynamische lijst van nummers -->
        </ul>
      </div>

    </div>

  </div>

  <script>
    // Standaard demo nummers als de lijst leeg is
    const defaultSongs = [
      {
        id: "default_1",
        title: "Piano Man (Karaoke)",
        artist: "Billy Joel",
        youtubeId: "3x9eS3uI0I4"
      },
      {
        id: "default_2",
        title: "I Want It That Way (Karaoke)",
        artist: "Backstreet Boys",
        youtubeId: "L_LUpnjgPso"
      }
    ];

    let songs = [];
    let currentSongId = null;

    // Laad afspeellijst uit localStorage bij opstarten
    function init() {
      const savedSongs = localStorage.getItem('karaoke_songs');
      if (savedSongs) {
        try {
          songs = JSON.parse(savedSongs);
        } catch(e) {
          songs = [...defaultSongs];
        }
      } else {
        songs = [...defaultSongs];
        saveSongs();
      }
      renderSongList();
    }

    // Bewaar in localStorage
    function saveSongs() {
      localStorage.setItem('karaoke_songs', JSON.stringify(songs));
      renderSongList();
    }

    // Extract YouTube Video ID uit verschillende URL formaten
    function extractYouTubeId(url) {
      if (!url) return null;
      
      // RegEx voor YouTube ID's (ondersteunt short links, gewone links, embeds, shorts)
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);

      return (match && match[2].length === 11) ? match[2] : null;
    }

    // Nieuw liedje toevoegen via formulier
    function handleAddSong(e) {
      e.preventDefault();
      
      const titleInput = document.getElementById('song-title');
      const artistInput = document.getElementById('song-artist');
      const urlInput = document.getElementById('youtube-url');

      const title = titleInput.value.trim();
      const artist = artistInput.value.trim() || "Onbekend";
      const url = urlInput.value.trim();

      const youtubeId = extractYouTubeId(url);

      if (!youtubeId) {
        alert("Ongeldige YouTube URL. Voer een geldige link in.");
        return;
      }

      const newSong = {
        id: Date.now().toString(),
        title: title,
        artist: artist,
        youtubeId: youtubeId
      };

      songs.push(newSong);
      saveSongs();

      // Formulier resetten
      titleInput.value = '';
      artistInput.value = '';
      urlInput.value = '';

      // Als het het eerste liedje is, laad het direct
      if (songs.length === 1) {
        playSong(newSong.id);
      }
    }

    // Verwijder liedje uit de lijst
    function deleteSong(id, event) {
      event.stopPropagation();
      if (confirm("Weet je zeker dat je dit nummer wilt verwijderen?")) {
        songs = songs.filter(song => song.id !== id);
        saveSongs();
        
        if (currentSongId === id) {
          currentSongId = null;
          document.getElementById('player').innerHTML = '';
          document.getElementById('player-placeholder').style.display = 'flex';
          document.getElementById('current-title').textContent = 'Geen nummer geselecteerd';
          document.getElementById('current-artist').textContent = 'Selecteer een nummer om te beginnen';
        }
      }
    }

    // Speel een specifiek liedje af
    function playSong(id) {
      const song = songs.find(s => s.id === id);
      if (!song) return;

      currentSongId = id;

      // Update speler UI
      document.getElementById('player-placeholder').style.display = 'none';
      const playerDiv = document.getElementById('player');
      
      // YouTube Embed Embedden met Autoplay
      playerDiv.innerHTML = `
        <iframe 
          src="https://www.youtube.com/embed/${song.youtubeId}?autoplay=1&enablejsapi=1" 
          title="${song.title}" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      `;

      // Update tekst van huidig nummer
      document.getElementById('current-title').textContent = song.title;
      document.getElementById('current-artist').textContent = song.artist;

      renderSongList();
    }

    // Speel een willekeurig liedje af (Shuffle)
    function playRandomSong() {
      if (songs.length === 0) {
        alert("Geen liedjes in de lijst! Voeg eerst een nummer toe.");
        return;
      }

      // Kies een ander nummer dan het huidige nummer (indien mogelijk)
      let availableSongs = songs;
      if (songs.length > 1 && currentSongId) {
        availableSongs = songs.filter(s => s.id !== currentSongId);
      }

      const randomIndex = Math.floor(Math.random() * availableSongs.length);
      playSong(availableSongs[randomIndex].id);
    }

    // Speel het volgende nummer in de lijst af
    function playNextSong() {
      if (songs.length === 0) return;

      if (!currentSongId) {
        playSong(songs[0].id);
        return;
      }

      const currentIndex = songs.findIndex(s => s.id === currentSongId);
      const nextIndex = (currentIndex + 1) % songs.length;
      playSong(songs[nextIndex].id);
    }

    // Update de weergave van de liedjeslijst
    function renderSongList() {
      const listEl = document.getElementById('song-list');
      const countEl = document.getElementById('song-count');

      countEl.textContent = `${songs.length} ${songs.length === 1 ? 'nummer' : 'nummers'}`;

      if (songs.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-music"></i>
            <p>Nog geen nummers toegevoegd.</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = songs.map(song => {
        const isActive = song.id === currentSongId;
        return `
          <li class="song-item ${isActive ? 'active' : ''}" onclick="playSong('${song.id}')">
            <div class="song-details">
              <div class="song-title-text">${escapeHtml(song.title)}</div>
              <div class="song-artist-text">${escapeHtml(song.artist)}</div>
            </div>
            <div class="song-actions">
              <button class="btn btn-secondary btn-icon" title="Afspelen">
                <i class="fa-solid ${isActive ? 'fa-volume-high' : 'fa-play'}"></i>
              </button>
              <button class="btn btn-danger btn-icon" onclick="deleteSong('${song.id}', event)" title="Verwijderen">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </li>
        `;
      }).join('');
    }

    // Helper functie tegen HTML-injectie
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initialiseren bij het laden van de pagina
    window.onload = init;
  </script>
</body>
</html>
