<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaoke Party Pro</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-color: #080511;
      --card-bg: #140f24;
      --card-bg-hover: #1e1735;
      --primary: #ff007f;
      --primary-hover: #ff2a9d;
      --secondary: #00f0ff;
      --accent: #9d00ff;
      --text: #ffffff;
      --text-dim: #a09cb0;
      --border: #2c2248;
      --success: #00ff88;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(135deg, #1f0c38 0%, #080511 100%);
      padding: 15px 25px;
      border-bottom: 2px solid var(--primary);
      box-shadow: 0 4px 25px rgba(255, 0, 127, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      z-index: 10;
    }

    header h1 {
      font-size: 1.8rem;
      color: #fff;
      text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mode-switch {
      display: flex;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px;
      border-radius: 30px;
      border: 1px solid var(--border);
    }

    .mode-btn {
      padding: 10px 22px;
      border-radius: 25px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-btn.active {
      background: linear-gradient(45deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
      flex: 1;
      transition: all 0.3s ease;
    }

    body.play-mode .container { grid-template-columns: 1fr; }
    body.play-mode .manage-only { display: none !important; }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    /* Interactive Hover Effect */
    .interactive-hover:hover {
      transform: translateY(-3px);
      border-color: var(--secondary);
      box-shadow: 0 12px 35px rgba(0, 240, 255, 0.2);
    }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: var(--secondary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Player Wrapper */
    .player-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
      border: 1px solid var(--border);
    }

    .player-container iframe, .player-placeholder {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; border: none;
    }

    .player-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      background: radial-gradient(circle, #1a1033 0%, #05030a 100%);
      text-align: center;
      padding: 20px;
    }

    .player-placeholder i {
      font-size: 5rem;
      margin-bottom: 15px;
      color: var(--primary);
      text-shadow: 0 0 20px var(--primary);
    }

    /* Prominente Speelmodus Knop */
    .hero-wheel-btn {
      display: none;
      margin: 15px 0;
      padding: 18px 30px;
      font-size: 1.4rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 50px;
      background: linear-gradient(45deg, #ff007f, #9d00ff, #00f0ff);
      background-size: 200% 200%;
      animation: gradientBG 3s ease infinite;
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .hero-wheel-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.8);
    }

    body.play-mode .hero-wheel-btn {
      display: block;
      width: 100%;
    }

    .player-controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 15px 20px;
      border-radius: 10px;
      border-left: 4px solid var(--secondary);
      flex-wrap: wrap;
      gap: 10px;
    }

    .song-info-active .title { font-weight: bold; font-size: 1.2rem; }
    .song-info-active .artist { color: var(--text-dim); font-size: 0.95rem; }

    /* Forms & Inputs */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: var(--text-dim); }
    input[type="text"] {
      width: 100%; padding: 12px; border-radius: 8px;
      border: 1px solid var(--border); background: #0c0818; color: #fff; font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { outline: none; border-color: var(--secondary); }

    /* Buttons */
    .btn {
      padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; font-size: 0.95rem; transition: all 0.2s; color: white;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
    .btn-secondary { background: #231b3b; border: 1px solid var(--border); }
    .btn-secondary:hover { background: #322852; color: var(--secondary); }
    .btn-accent { background: linear-gradient(45deg, var(--primary), var(--accent)); }
    .btn-block { width: 100%; }
    .btn-icon { padding: 8px 12px; }
    .btn-danger { background: #dc3545; }

    /* Song list */
    .song-list { list-style: none; max-height: 420px; overflow-y: auto; }
    .song-item {
      background: #100b21; border: 1px solid var(--border); border-radius: 8px;
      padding: 12px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;
      gap: 10px; transition: all 0.2s; cursor: pointer;
    }
    .song-item:hover { border-color: var(--secondary); background: var(--card-bg-hover); }
    .song-item.played { opacity: 0.4; }
    .song-item.active { border-color: var(--primary); background: rgba(255, 0, 127, 0.15); }
    .song-item .details { flex: 1; min-width: 0; }
    .song-item .title-text { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-item .artist-text { font-size: 0.85rem; color: var(--text-dim); }

    /* Rad van Fortuin Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.88); display: none; align-items: center; justify-content: center;
      z-index: 1000; backdrop-filter: blur(8px);
    }
    .modal-overlay.active { display: flex; }

    .wheel-modal {
      background: var(--card-bg); border: 2px solid var(--accent); border-radius: 20px;
      padding: 30px; text-align: center; max-width: 520px; width: 92%;
      box-shadow: 0 0 50px rgba(157, 0, 255, 0.5); position: relative;
    }

    .wheel-container { position: relative; width: 340px; height: 340px; margin: 20px auto; }
    canvas#wheel { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); }

    .wheel-pointer {
      position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 18px solid transparent; border-right: 18px solid transparent;
      border-top: 30px solid #ffffff; z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
    }

    .wheel-status {
      font-size: 1.2rem; font-weight: bold; margin-top: 10px; color: var(--secondary); height: 30px;
    }

    /* Modal Edit */
    .edit-modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 25px; max-width: 450px; width: 90%; }
  </style>
</head>
<body class="play-mode">

  <header>
    <h1><i class="fa-solid fa-microphone-lines"></i> Karaoke Party Pro</h1>
    <div class="mode-switch">
      <button class="mode-btn active" id="btn-mode-play" onclick="setMode('play')">
        <i class="fa-solid fa-play"></i> Speelmodus
      </button>
      <button class="mode-btn" id="btn-mode-manage" onclick="setMode('manage')">
        <i class="fa-solid fa-sliders"></i> Beheermodus
      </button>
    </div>
  </header>

  <div class="container">
    
    <!-- Linker Kolom: Videospeler & Rad Knop -->
    <div class="left-column">
      <div class="card interactive-hover">
        <h2><i class="fa-solid fa-tv"></i> Karaoke Scherm</h2>
        
        <div class="player-container" id="player-container">
          <div id="player-placeholder" class="player-placeholder">
            <i class="fa-solid fa-compact-disc fa-spin"></i>
            <p>Druk op de grote knop hieronder om het rad te laten draaien!</p>
          </div>
          <div id="player"></div>
        </div>

        <!-- Opvallende grote knop voor speelmodus -->
        <button class="hero-wheel-btn" onclick="openAndSpinWheel()">
          <i class="fa-solid fa-dharmachakra"></i> 🎲 Draai aan het Rad!
        </button>

        <div class="player-controls-bar">
          <div class="song-info-active">
            <div class="title" id="current-title">Geen nummer actief</div>
            <div class="artist" id="current-artist">Draai het rad voor een nummer</div>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-secondary manage-only" onclick="openAndSpinWheel()">
              <i class="fa-solid fa-dharmachakra"></i> Rad
            </button>
            <button class="btn btn-secondary" onclick="playNext()">
              <i class="fa-solid fa-forward"></i> Volgende
            </button>
            <button class="btn btn-secondary btn-icon" onclick="toggleFullscreen()" title="Volledig Scherm">
              <i class="fa-solid fa-expand"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Rechter Kolom: Beheer -->
    <div class="right-column manage-only" style="display: flex; flex-direction: column; gap: 20px;">
      
      <!-- Nummer Toevoegen -->
      <div class="card interactive-hover">
        <h2><i class="fa-solid fa-plus"></i> Nummer Toevoegen</h2>
        <form onsubmit="handleAddSong(event)">
          <div class="form-group">
            <label>Titel / Liedje</label>
            <input type="text" id="add-title" placeholder="bv. Bohemian Rhapsody" required>
          </div>
          <div class="form-group">
            <label>Artiest</label>
            <input type="text" id="add-artist" placeholder="bv. Queen">
          </div>
          <div class="form-group">
            <label>YouTube Link</label>
            <input type="text" id="add-url" placeholder="https://www.youtube.com/watch?v=..." required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">
            <i class="fa-solid fa-plus"></i> Toevoegen
          </button>
        </form>
      </div>

      <!-- Afspeellijst & Delen -->
      <div class="card interactive-hover" style="flex:1;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h2><i class="fa-solid fa-list"></i> Afspeellijst</h2>
          <button class="btn btn-secondary btn-icon" onclick="sharePlaylist()" title="Kopieer Deellink">
            <i class="fa-solid fa-share-nodes"></i> Link Delen
          </button>
        </div>
        <ul class="song-list" id="song-list"></ul>
      </div>

    </div>

  </div>

  <!-- Rad van Fortuin Modal -->
  <div class="modal-overlay" id="wheel-modal">
    <div class="wheel-modal">
      <h2 style="color:var(--secondary); font-size: 1.6rem;"><i class="fa-solid fa-dharmachakra"></i> Het Rad Draait...</h2>
      <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <canvas id="wheel" width="340" height="340"></canvas>
      </div>
      <div class="wheel-status" id="wheel-status">Aan het spinnen!</div>
    </div>
  </div>

  <!-- Bewerken Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="edit-modal">
      <h2><i class="fa-solid fa-pen"></i> Nummer Bewerken</h2>
      <form onsubmit="handleSaveEdit(event)" style="margin-top: 15px;">
        <input type="hidden" id="edit-id">
        <div class="form-group">
          <label>Titel</label>
          <input type="text" id="edit-title" required>
        </div>
        <div class="form-group">
          <label>Artiest</label>
          <input type="text" id="edit-artist">
        </div>
        <div class="form-group">
          <label>YouTube Link</label>
          <input type="text" id="edit-url" required>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
          <button type="submit" class="btn btn-primary btn-block">Opslaan</button>
          <button type="button" class="btn btn-secondary btn-block" onclick="closeEditModal()">Annuleren</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const defaultSongs = [
      { id: "1", title: "Leef (Karaoke)", artist: "André Hazes Jr.", youtubeId: "3x9eS3uI0I4", played: false },
      { id: "2", title: "I Want It That Way", artist: "Backstreet Boys", youtubeId: "L_LUpnjgPso", played: false },
      { id: "3", title: "Piano Man", artist: "Billy Joel", youtubeId: "3x9eS3uI0I4", played: false }
    ];

    let songs = [];
    let currentSongId = null;
    let isSpinning = false;
    let currentAngle = 0;

    // Regenboogkleuren palette voor het rad
    const rainbowColors = [
      '#FF0000', '#FF7F00', '#FFFF00', '#00FF00', 
      '#00F0FF', '#0040FF', '#8B00FF', '#FF007F'
    ];

    function init() {
      // 1. Probeer nummers te laden uit de URL hash (voor universeel delen)
      if (window.location.hash && window.location.hash.length > 5) {
        try {
          const jsonString = decodeURIComponent(atob(window.location.hash.substring(1)));
          songs = JSON.parse(jsonString);
        } catch(e) {
          loadFromLocal();
        }
      } else {
        loadFromLocal();
      }
      saveSongs();
    }

    function loadFromLocal() {
      const saved = localStorage.getItem('karaoke_pro_songs');
      if (saved) {
        try { songs = JSON.parse(saved); } catch(e) { songs = [...defaultSongs]; }
      } else {
        songs = [...defaultSongs];
      }
    }

    function saveSongs() {
      // Sla op in localStorage
      localStorage.setItem('karaoke_pro_songs', JSON.stringify(songs));
      
      // Sla op in URL Hash zodat de link gedeeld kan worden!
      const jsonString = JSON.stringify(songs);
      const encoded = btoa(encodeURIComponent(jsonString));
      window.history.replaceState(null, null, '#' + encoded);

      renderSongList();
    }

    function sharePlaylist() {
      navigator.clipboard.writeText(window.location.href);
      alert("Afspeellijst-link gekopieerd! Iedereen die deze link opent krijgt exact jouw nummers te zien.");
    }

    function setMode(mode) {
      document.body.classList.remove('manage-mode', 'play-mode');
      document.body.classList.add(mode + '-mode');
      document.getElementById('btn-mode-manage').classList.toggle('active', mode === 'manage');
      document.getElementById('btn-mode-play').classList.toggle('active', mode === 'play');
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function handleAddSong(e) {
      e.preventDefault();
      const title = document.getElementById('add-title').value.trim();
      const artist = document.getElementById('add-artist').value.trim() || "Onbekend";
      const url = document.getElementById('add-url').value.trim();
      const youtubeId = extractYouTubeId(url);

      if (!youtubeId) { alert("Voer een geldige YouTube link in."); return; }

      songs.push({ id: Date.now().toString(), title, artist, youtubeId, played: false });
      saveSongs();

      document.getElementById('add-title').value = '';
      document.getElementById('add-artist').value = '';
      document.getElementById('add-url').value = '';
    }

    function playSong(id) {
      const song = songs.find(s => s.id === id);
      if (!song) return;

      currentSongId = id;
      song.played = true;
      saveSongs();

      document.getElementById('player-placeholder').style.display = 'none';
      const playerDiv = document.getElementById('player');
      
      playerDiv.innerHTML = `
        <iframe 
          src="https://www.youtube-nocookie.com/embed/${song.youtubeId}?autoplay=1&rel=0" 
          title="${escapeHtml(song.title)}" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      `;

      document.getElementById('current-title').textContent = song.title;
      document.getElementById('current-artist').textContent = song.artist;
    }

    function playNext() {
      const unplayed = songs.filter(s => !s.played);
      if (unplayed.length > 0) playSong(unplayed[0].id);
      else if (songs.length > 0) playSong(songs[0].id);
    }

    /* Rad van Fortuin Logica */
    function openAndSpinWheel() {
      const unplayed = songs.filter(s => !s.played);
      if (unplayed.length === 0) {
        if (songs.length === 0) { alert("Voeg eerst nummers toe!"); return; }
        // Reset automatisch als alle nummers gespeeld zijn
        songs.forEach(s => s.played = false);
        saveSongs();
      }

      document.getElementById('wheel-modal').classList.add('active');
      document.getElementById('wheel-status').textContent = "Aan het spinnen...";
      
      // Meteen automatisch starten met draaien!
      setTimeout(spinWheel, 300);
    }

    function drawWheel() {
      const canvas = document.getElementById('wheel');
      const ctx = canvas.getContext('2d');
      const unplayed = songs.filter(s => !s.played);
      const numSegments = unplayed.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (numSegments === 0) return;

      const arc = (2 * Math.PI) / numSegments;

      for (let i = 0; i < numSegments; i++) {
        const angle = currentAngle + i * arc;
        
        // Regenboog Segment
        ctx.beginPath();
        ctx.fillStyle = rainbowColors[i % rainbowColors.length];
        ctx.moveTo(170, 170);
        ctx.arc(170, 170, 170, angle, angle + arc);
        ctx.lineTo(170, 170);
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Grote, goed leesbare tekst met contour
        ctx.save();
        ctx.translate(170, 170);
        ctx.rotate(angle + arc / 2);
        
        ctx.font = "bold 16px Segoe UI, sans-serif";
        ctx.textAlign = "right";
        
        const titleText = unplayed[i].title.length > 16 ? unplayed[i].title.substring(0, 14) + '..' : unplayed[i].title;

        // Zwarte tekstomlijning voor maximale leesbaarheid
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 4;
        ctx.strokeText(titleText, 150, 5);
        
        ctx.fillStyle = "#ffffff";
        ctx.fillText(titleText, 150, 5);
        
        ctx.restore();
      }
    }

    function spinWheel() {
      if (isSpinning) return;
      const unplayed = songs.filter(s => !s.played);
      if (unplayed.length === 0) return;

      isSpinning = true;
      const spinAngle = Math.floor(Math.random() * 360) + 2160; // Extra lang spinnen voor spanning
      const duration = 4500;
      const start = performance.now();

      function animate(time) {
        const elapsed = time - start;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 4);

        currentAngle = (easeOut * (spinAngle * Math.PI / 180));
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;

          const numSegments = unplayed.length;
          const arc = (2 * Math.PI) / numSegments;
          const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
          const index = Math.floor(((normalizedAngle + Math.PI / 2) % (2 * Math.PI)) / arc);
          const selectedSong = unplayed[index % numSegments];

          document.getElementById('wheel-status').textContent = `Gekozen: ${selectedSong.title}!`;

          setTimeout(() => {
            document.getElementById('wheel-modal').classList.remove('active');
            playSong(selectedSong.id);
          }, 1200);
        }
      }

      requestAnimationFrame(animate);
    }

    function toggleFullscreen() {
      const container = document.getElementById('player-container');
      if (!document.fullscreenElement) {
        if (container.requestFullscreen) container.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function renderSongList() {
      const listEl = document.getElementById('song-list');
      if (songs.length === 0) {
        listEl.innerHTML = `<li style="text-align:center; color:var(--text-dim); padding:20px;">Geen nummers</li>`;
        return;
      }

      listEl.innerHTML = songs.map(song => {
        const isActive = song.id === currentSongId;
        return `
          <li class="song-item ${isActive ? 'active' : ''} ${song.played ? 'played' : ''}" onclick="playSong('${song.id}')">
            <div class="details">
              <div class="title-text">${escapeHtml(song.title)} ${song.played ? '✓' : ''}</div>
              <div class="artist-text">${escapeHtml(song.artist)}</div>
            </div>
            <div style="display:flex; gap:4px;">
              <button class="btn btn-secondary btn-icon" onclick="openEditModal('${song.id}', event)"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-danger btn-icon" onclick="deleteSong('${song.id}', event)"><i class="fa-solid fa-trash"></i></button>
            </div>
          </li>
        `;
      }).join('');
    }

    function deleteSong(id, event) {
      event.stopPropagation();
      if (confirm("Nummer verwijderen?")) {
        songs = songs.filter(s => s.id !== id);
        saveSongs();
      }
    }

    function openEditModal(id, event) {
      event.stopPropagation();
      const song = songs.find(s => s.id === id);
      if (!song) return;
      document.getElementById('edit-id').value = song.id;
      document.getElementById('edit-title').value = song.title;
      document.getElementById('edit-artist').value = song.artist;
      document.getElementById('edit-url').value = `https://www.youtube.com/watch?v=${song.youtubeId}`;
      document.getElementById('edit-modal').classList.add('active');
    }

    function closeEditModal() { document.getElementById('edit-modal').classList.remove('active'); }

    function handleSaveEdit(e) {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      const song = songs.find(s => s.id === id);
      if (song) {
        const youtubeId = extractYouTubeId(document.getElementById('edit-url').value);
        if (!youtubeId) { alert("Ongeldige URL"); return; }
        song.title = document.getElementById('edit-title').value.trim();
        song.artist = document.getElementById('edit-artist').value.trim() || "Onbekend";
        song.youtubeId = youtubeId;
        saveSongs();
        closeEditModal();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.onload = init;
  </script>
</body>
</html>
